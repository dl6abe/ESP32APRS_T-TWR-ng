; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3box]
platform = espressif32@6.4.0
board = esp32s3box
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
monitor_filters = esp32_exception_decoder
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.17
	densaugeo/base64@^1.4.0
	tinyu-zhao/TinyGPSPlus-ESP32@^0.0.2
	suculent/ESP32httpUpdate@^2.1.145
	lewisxhe/XPowersLib@^0.1.7
	adafruit/Adafruit NeoPixel@^1.15.5
	igorantolic/Ai Esp32 Rotary Encoder@^1.7
	zmeiresearch/Wireguard client for LwIP on ESP32@^1.0.1
	ricmoo/QRCode@^0.0.1
	plerup/EspSoftwareSerial@^8.2.0
	arcao/Syslog@^2.0.0
	h2zero/NimBLE-Arduino@^2.2.2
build_flags =
	-L./lib
	-Wl,-Map,output.map
	-DCONFIG_DISABLE_HAL_LOCKS=1
	-DBOARD_HAS_PSRAM
	; Was -UARDUINO_USB_CDC_ON_BOOT (explicitly disabled) - found 2026-09-27
	; this is why the recovery console's Serial.read() never saw input:
	; disabling CDC-on-boot binds Arduino's Serial to UART0 hardware pins
	; instead of the ESP32-S3's native USB-JTAG/CDC peripheral, which is
	; the only thing actually wired to the USB port used for flashing/
	; monitoring. The esp32s3box board manifest's own default is
	; ARDUINO_USB_CDC_ON_BOOT=1 for exactly this reason - this line was
	; overriding that default. Confirmed against icssw-org/MeshCom-Firmware
	; (cloned to ../reference/MeshCom-Firmware, see FORK_NOTES.md): their
	; net_console.cpp comments document the same S3-native-USB-CDC
	; requirement explicitly. Serial is not used for anything but console
	; I/O in this project (grepped), so nothing else depends on it staying
	; bound to UART0.
	-mfix-esp32-psram-cache-issue
	; Was 5 (Verbose) - that level makes the Arduino core's own internal
	; logging (WebServer.cpp/Parsing.cpp per-HTTP-header trace, etc.) spam
	; the console; nothing this project relies on is at Verbose level, only
	; Debug and above (see FORK_NOTES.md's console/syslog logging entry).
	-DCORE_DEBUG_LEVEL=4
	; Individually-enabled warnings (not the full -Wall/-Wextra - see CLAUDE.md).
	; Each one is 0 warnings across src/+lib/ as of the fixes that added it;
	; -Wformat and -Wimplicit-fallthrough still report 2 and 1 pre-existing
	; warnings respectively from unmodified registry/vendored dependencies
	; (Wireguard client for LwIP, TinyGPSPlus-ESP32) - accepted, not ours to fix.
	-Wformat
	-Wformat-overflow
	-Wmaybe-uninitialized
	-Wimplicit-fallthrough
	-Wchar-subscripts
	-Wparentheses

; [env:sa868_vhf_open_edition]
; build_flags = ${env.build_flags} -DSA868_OPEN_EDITION
; lib_deps = plerup/EspSoftwareSerial@^8.2.0

; [env:sa868_vhf_open_edition_debug]
; debug_tool = esp-builtin
; build_type = debug
; build_flags = ${env:sa868_vhf_open_edition.build_flags} -DCORE_DEBUG_LEVEL=5
; lib_deps = plerup/EspSoftwareSerial@^8.2.0

; Runs on real T-TWR hardware over serial (Unity/PlatformIO test framework).
; Only compiles parse_aprs.cpp - not main.cpp/gui_lcd.cpp/webservice.cpp - so no
; setup()/loop() clash and no dependency on display/radio/GPS globals.
; lib_deps is cleared here: parse_aprs.cpp only needs the Arduino core, and the
; inherited lib_deps (SSD1306 etc.) would otherwise pull in Adafruit_GFX/SPI
; without anything in this build's sources to make LDF register SPI itself.
; Run with: pio test -e test_parse_aprs
[env:test_parse_aprs]
extends = env:esp32s3box
test_build_src = true
build_src_filter = +<*> -<*> +<parse_aprs.cpp>
test_filter = test_parse_aprs
lib_deps =
